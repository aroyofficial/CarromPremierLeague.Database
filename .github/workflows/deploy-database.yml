name: Deploy database

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or full commit SHA to apply
        required: true
        default: develop
        type: string
      apply:
        description: Apply this schema to the live SQL Server. Leave unchecked to generate the script only.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Generate and apply schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Check required secrets
        if: inputs.apply
        env:
          CPL_DB_HOST: ${{ secrets.CPL_DB_HOST }}
          CPL_DB_USER: ${{ secrets.CPL_DB_USER }}
          CPL_DB_PWD: ${{ secrets.CPL_DB_PWD }}
          CPL_DB_NAME: ${{ secrets.CPL_DB_NAME }}
        run: |
          missing=0
          for name in CPL_DB_HOST CPL_DB_USER CPL_DB_PWD CPL_DB_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name} is not set."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install PowerShell and sqlcmd
        run: |
          set -euo pipefail
          . /etc/os-release
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${VERSION_CODENAME} main" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y powershell mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Generate setup.sql
        shell: pwsh
        run: ./Setup-Database.ps1 -GenerateOnly -SqlPassword "unused"

      - name: Upload the generated script
        uses: actions/upload-artifact@v4
        with:
          name: setup-sql-${{ github.sha }}
          path: setup.sql
          if-no-files-found: error

      - name: Apply the schema to SQL Server
        if: inputs.apply
        shell: pwsh
        env:
          CPL_DB_HOST: ${{ secrets.CPL_DB_HOST }}
          CPL_DB_PORT: ${{ secrets.CPL_DB_PORT }}
          CPL_DB_USER: ${{ secrets.CPL_DB_USER }}
          CPL_DB_PWD: ${{ secrets.CPL_DB_PWD }}
          CPL_DB_NAME: ${{ secrets.CPL_DB_NAME }}
        run: |
          $port = if ([string]::IsNullOrWhiteSpace($env:CPL_DB_PORT)) { "1433" } else { $env:CPL_DB_PORT }
          $server = "$($env:CPL_DB_HOST),$port"
          ./Setup-Database.ps1 -Apply -Server $server -DatabaseName $env:CPL_DB_NAME -SqlUsername $env:CPL_DB_USER -SqlPassword $env:CPL_DB_PWD
